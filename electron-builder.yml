appId: com.dinhtnn.multi-ai-dev-studio
productName: Multi-AI Development Studio
copyright: Copyright (c) Dinhtnn
directories:
  output: release
  buildResources: build
# The renderer, preload and main bundles are fully bundled by electron-vite (the main
# process only imports electron and Node built-ins), so nothing from node_modules ships.
files:
  - out/**
  - package.json
asar: true
# The Unity MCP bridge package copied into Unity projects that lack it (see THIRD_PARTY_NOTICES.md).
extraResources:
  - from: resources/unity-mcp-plugin
    to: unity-mcp-plugin
# Reuse the Electron already installed for development instead of downloading it again.
electronDist: node_modules/electron/dist
npmRebuild: false
forceCodeSigning: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # No code-signing certificate is configured: the binaries are unsigned (Windows SmartScreen will warn).
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: MultiAI-Studio-${version}-setup.${ext}
portable:
  artifactName: MultiAI-Studio-${version}-portable.${ext}
